<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Claper on this slide</title>
    <script src="https://appsforoffice.microsoft.com/lib/1/hosted/office.js"></script>
    <style>
      :root {
        color-scheme: light;
        --ink: #111827;
        --muted: #4b5563;
        --line: #d1d5db;
        --brand: #140553;
        --danger: #b91c1c;
      }
      * { box-sizing: border-box; }
      /* The block is sized by the slide it sits on, and whatever it shows has to
         fit that size. Without this the object gets a scrollbar the moment the
         author makes it a little smaller than the content wants, which on a
         slide reads as a defect rather than as a hint. */
      html, body {
        margin: 0; height: 100%; overflow: hidden;
        font: 14px/1.45 system-ui, "Segoe UI", sans-serif; color: var(--ink);
        background: transparent;
      }
      body { display: flex; }
      iframe { border: 0; width: 100%; height: 100%; display: block; }

      .stage { position: relative; width: 100%; height: 100%; }
      /* Only visible when the pointer is on the object, so it stays out of the
         way while the deck is being shown. */
      .change {
        position: absolute; top: .35rem; right: .35rem; opacity: 0;
        transition: opacity .12s; background: rgba(17,24,39,.75); color: #fff;
        border: 0; border-radius: .4rem; padding: .2rem .5rem;
        font: inherit; font-size: .72rem; font-weight: 600; cursor: pointer;
      }
      .stage:hover .change, .change:focus-visible { opacity: 1; }

      /* The one place that may scroll, and only when the object is too small for
         the form. Never the stage, which is what people look at. */
      .setup { margin: auto; padding: 1.25rem; max-width: 24rem; width: 100%; max-height: 100%; overflow-y: auto; }
      .setup h1 { font-size: 1rem; margin: 0 0 .25rem; }
      .setup p { margin: 0 0 .9rem; color: var(--muted); font-size: .8rem; }
      label { display: block; font-weight: 600; font-size: .78rem; margin: .75rem 0 .2rem; }
      input, select {
        width: 100%; padding: .5rem .6rem; border: 1px solid var(--line);
        border-radius: .5rem; font: inherit; background: #fff; color: var(--ink);
      }
      input:focus, select:focus { outline: 2px solid var(--brand); outline-offset: 1px; }
      button.go {
        margin-top: 1rem; width: 100%; padding: .55rem; border: 0; border-radius: 999px;
        background: var(--brand); color: #fff; font: inherit; font-weight: 600; cursor: pointer;
      }
      button.go:disabled { opacity: .55; cursor: default; }
      button.plain {
        margin-top: .45rem; width: 100%; padding: .45rem; border: 1px solid var(--line);
        border-radius: 999px; background: #fff; color: var(--ink); font: inherit; cursor: pointer;
      }
      .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: .5rem; }
      .switch { display: flex; align-items: center; gap: .45rem; margin: .7rem 0 .2rem; font-size: .78rem; font-weight: 600; }
      .switch input { width: auto; }
      input[type="color"] { padding: .15rem; height: 2.1rem; cursor: pointer; }
      details { margin-top: .7rem; }
      details summary { cursor: pointer; font-weight: 600; font-size: .78rem; color: var(--muted); }
      .err { color: var(--danger); font-size: .78rem; margin-top: .6rem; min-height: 1rem; }
      .err.ok { color: #146c43; }
      [hidden] { display: none !important; }
    </style>
  </head>
  <body>
    <div class="stage" id="stage" hidden>
      <iframe id="frame" title="Claper interaction"></iframe>
      <button class="change" id="change" type="button">Change</button>
    </div>

    <div class="setup" id="setup" hidden>
      <h1>Claper on this slide</h1>
      <p id="intro">
        Paste the link from the Claper sidebar once. It is stored with this presentation, so everyone
        who opens the file sees the same thing.
      </p>

      <div id="step1">
        <label for="url">Slide link</label>
        <input id="url" type="url" placeholder="https://claper.example.com/embed/interaction/KEY" />
        <button class="go" id="connect" type="button">Continue</button>
      </div>

      <div id="step2" hidden>
        <label for="what">Show on this slide</label>
        <select id="what"></select>

        <!-- Folded away by default: four dropdowns open made the panel 438px
             tall against an object 420px high, which is the scrollbar the
             author then sees. Measured, not guessed. -->
        <details id="look">
          <summary>Change how it looks</summary>
          <div class="grid2" style="margin-top:.5rem">
            <div>
              <label for="theme">Text</label>
              <select id="theme">
                <option value="light">Dark text</option>
                <option value="dark">Light text</option>
              </select>
            </div>
            <div>
              <label for="panel">Background</label>
              <select id="panel">
                <option value="off">Transparent</option>
                <option value="on">Card</option>
              </select>
            </div>
            <div>
              <label for="radius">Bars</label>
              <select id="radius">
                <option value="soft">Slightly rounded</option>
                <option value="sharp">Square</option>
                <option value="round">Fully rounded</option>
              </select>
            </div>
            <div>
              <label for="shadow">Shadow</label>
              <select id="shadow">
                <option value="off">None</option>
                <option value="on">Soft shadow</option>
              </select>
            </div>
            <!-- Only means anything for an open question, and it is folded away
                 with the rest, so it is left in place rather than shown and
                 hidden as the choice above changes. -->
            <div>
              <label for="layout">Open answers</label>
              <select id="layout">
                <option value="cloud">Word cloud</option>
                <option value="list">One after another</option>
              </select>
            </div>
            <div>
              <label for="board">Quiz leaderboard</label>
              <select id="board">
                <option value="off">Do not show</option>
                <option value="on">Under the answers</option>
              </select>
            </div>
          </div>

          <!-- The two dropdowns above pick between readable defaults. A deck
               with a palette of its own needs the colours themselves, and
               those live here so the simple case stays two dropdowns. -->
          <label class="switch">
            <input id="ownColours" type="checkbox" />
            <span>Use my own colours</span>
          </label>
          <div class="grid2" id="colours" hidden>
            <div>
              <label for="text">Text colour</label>
              <input id="text" type="color" value="#111827" />
            </div>
            <div>
              <label for="bar">Bar colour</label>
              <input id="bar" type="color" value="#140553" />
            </div>
          </div>
        </details>

        <button class="go" id="save" type="button">Show it</button>
        <button class="plain" id="useOther" type="button">Use a different link</button>
      </div>

      <div class="err" id="err"></div>
    </div>

    <script>
      // Everything here lives in this object's own settings, so it travels with
      // the .pptx exactly like a picture on a slide does. That is deliberate:
      // the embed link is read only and is meant to be shared with the file.
      // The sidebar's writing token is never put here.
      var KEY = "claper.slide";

      // Each block has its own settings bag and cannot read the sidebar's, so a
      // link kept there would have to be pasted into every block by hand. A
      // presentation tag is document-scoped instead of add-in-scoped, which is
      // what lets the sidebar hand the link to every block at once. Keys are
      // stored uppercase by PowerPoint, so it is written uppercase here too.
      var DECK_TAG = "CLAPERLINK";

      function tagsUsable() {
        try {
          return typeof PowerPoint !== "undefined" &&
            Office.context.requirements.isSetSupported("PowerPointApi", "1.3");
        } catch (e) {
          return false;
        }
      }

      function readDeckLink() {
        if (!tagsUsable()) return Promise.resolve("");
        return PowerPoint.run(function (context) {
          var tag = context.presentation.tags.getItemOrNullObject(DECK_TAG);
          tag.load("value");
          return context.sync().then(function () {
            return tag.isNullObject ? "" : tag.value || "";
          });
        }).catch(function () { return ""; });
      }

      var state = {
        link: "",
        show: "interaction",
        poll: null,
        quiz: null,
        form: null,
        theme: "light",
        // Transparent by default. A block sits on a slide that already has a
        // background, and a white card on top of it is a rectangle the author
        // then has to design around.
        panel: "off",
        radius: "soft",
        shadow: "off",
        // How the answers to an open question are drawn. A cloud says at a
        // glance what the room agrees on, which is what an open question is
        // asked for; a list is for answers that are sentences.
        layout: "cloud",
        // Whether a quiz block shows who is winning underneath. Off, because a
        // board is something an author decides to put on a slide rather than
        // something that appears under every quiz they place.
        board: "off",
        // Empty means "whatever the theme says", which is the readable default.
        // Only a colour the author actually picked is sent.
        text: "",
        bar: ""
      };


      // ---------- language ----------
      //
      // A static file cannot render gettext, so it carries its English and swaps
      // it once Office has said which language it is set to. The English is the
      // key, which is why none of the markup had to be marked up.
      var dict = {};

      function t(text) { return dict[text] || text; }

      function translatePage(root) {
        var walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT, null);
        var nodes = [];
        while (walker.nextNode()) nodes.push(walker.currentNode);
        nodes.forEach(function (node) {
          // The backslash matters: /s+/ matches the letter s, so every "s" in
          // the page became a space and nothing matched the dictionary.
          var key = node.nodeValue.replace(/\s+/g, " ").trim();
          if (!key) return;
          var hit = dict[key];
          if (hit && hit !== key) node.nodeValue = node.nodeValue.replace(key, hit);
        });
        root.querySelectorAll("[placeholder]").forEach(function (el) {
          var hit = dict[el.getAttribute("placeholder")];
          if (hit) el.setAttribute("placeholder", hit);
        });
      }

      function pickLocale(all, wanted) {
        if (!wanted) return null;
        var lower = String(wanted).toLowerCase();
        var base = lower.split("-")[0];
        var keys = Object.keys(all);
        var exact = keys.filter(function (k) { return k.toLowerCase() === lower; })[0];
        if (exact) return exact;
        return keys.filter(function (k) { return k.toLowerCase().split("-")[0] === base; })[0] || null;
      }

      // The origin comes from the block's own link, which is the only address
      // this page knows. Without one there is nothing to translate against yet.
      function loadLanguage() {
        var parts = parseLink(state.link);
        var wanted;
        try { wanted = Office.context.displayLanguage; } catch (e) { wanted = null; }
        if (!parts || !wanted) return Promise.resolve();

        return fetch(parts.origin + "/addin/strings.json")
          .then(function (r) { return r.ok ? r.json() : null; })
          .then(function (all) {
            if (!all) return;
            var locale = pickLocale(all, wanted);
            if (!locale) return;
            dict = all[locale] || {};
            translatePage(document.body);
          })
          .catch(function () {});
      }

      function $(id) { return document.getElementById(id); }
      function say(text, ok) { var e = $("err"); e.className = "err" + (ok ? " ok" : ""); e.textContent = text || ""; }

      function parseLink(url) {
        try {
          var u = new URL(url);
          var ok = (u.protocol === "https:" || u.hostname === "localhost") &&
                   u.pathname.indexOf("/embed/interaction/") === 0;
          var token = u.pathname.slice("/embed/interaction/".length).replace(/\/+$/, "");
          if (!ok || !token) return null;
          return { origin: u.origin, token: token, base: u.origin + "/embed/interaction/" + token };
        } catch (e) {
          return null;
        }
      }

      function viewUrl() {
        var parts = parseLink(state.link);
        if (!parts) return "";
        var q = [
          "theme=" + state.theme,
          "panel=" + state.panel,
          "radius=" + state.radius,
          "shadow=" + state.shadow,
          "layout=" + state.layout,
          "board=" + state.board
        ];
        // Only when chosen. Sending the default as a colour would freeze it, so
        // a later change to what Claper considers readable would not reach a
        // block already sitting on a slide.
        if (state.text) q.push("text=" + encodeURIComponent(state.text));
        if (state.bar) q.push("bar=" + encodeURIComponent(state.bar));

        if (state.show === "join" || state.show === "messages") {
          q.unshift("show=" + state.show);
        } else if (state.quiz) {
          q.unshift("quiz=" + state.quiz);
        } else if (state.form) {
          q.unshift("form=" + state.form);
        } else if (state.poll) {
          q.unshift("poll=" + state.poll);
        }
        return parts.base + "?" + q.join("&");
      }

      // The setup form is hidden rather than thrown away, because "Change" has
      // to bring it back. Rebuilding it from a reload would not work: on a
      // reload the saved choice is found again and the block goes straight back
      // to showing it.
      function present() {
        var url = viewUrl();
        if (!url) { openSetup(false); return; }

        var stage = $("stage");
        stage.hidden = false;
        $("setup").hidden = true;
        $("frame").src = url;

        // A slide link is replaced whenever a new one is made for the event, and
        // this block would then frame Claper's own 404 page: a dead rectangle
        // mid-talk with nothing saying why. One request on open turns that into
        // a sentence and the form for a new link.
        // Only a 404 means the link itself is gone. A network hiccup leaves the
        // frame alone, because it will right itself and the block is on a slide
        // somebody may be looking at.
        var parts = parseLink(state.link);
        if (parts) {
          loadCatalogue(parts).catch(function (e) {
            if (e.status !== 404) return;
            $("frame").src = "about:blank";
            openSetup(false);
            say(t("This slide link no longer works. Ask the Claper sidebar for the current one."));
          });
        }
      }

      function reconfigure() {
        $("frame").src = "about:blank";
        $("stage").hidden = true;
        say("");

        var parts = parseLink(state.link);
        if (!parts) { openSetup(false); return; }

        openSetup(true);
        loadCatalogue(parts)
          .then(fillChoices)
          .catch(function (e) { say(e.message); openSetup(false); });
      }

      // The list of what this event has, fetched with the read-only link itself.
      // Without it the only way to point a slide at one question is to type its
      // id into the URL by hand.
      function loadCatalogue(parts) {
        return fetch(parts.origin + "/api/embed/" + parts.token + "/interactions")
          .then(function (r) {
            return r.json().catch(function () { return {}; }).then(function (body) {
              if (!r.ok) {
                var e = new Error(body.error || ("Claper answered " + r.status));
                e.status = r.status;
                throw e;
              }
              return body;
            });
          });
      }

      function fillChoices(body) {
        var what = $("what");
        what.innerHTML = "";

        function add(value, text) {
          var o = document.createElement("option");
          o.value = value;
          o.textContent = text;
          what.appendChild(o);
        }

        function group(name) {
          var g = document.createElement("optgroup");
          g.label = t(name);
          what.appendChild(g);
          return g;
        }

        add("join", t("How to join (QR code and code)"));
        add("messages", t("Messages from the audience"));
        add("interaction", t("Whatever Claper is showing right now"));

        var polls = body.polls || [];
        if (polls.length) {
          var gp = group(t("Polls"));
          polls.forEach(function (p) {
            var o = document.createElement("option");
            o.value = "poll:" + p.id;
            o.textContent = p.title;
            gp.appendChild(o);
          });
        }

        var quizzes = body.quizzes || [];
        if (quizzes.length) {
          var gq = group(t("Quizzes"));
          quizzes.forEach(function (q) {
            var o = document.createElement("option");
            o.value = "quiz:" + q.id;
            o.textContent = q.title;
            gq.appendChild(o);
          });
        }

        var forms = body.forms || [];
        if (forms.length) {
          var gf = group(t("Open questions"));
          forms.forEach(function (f) {
            var o = document.createElement("option");
            o.value = "form:" + f.id;
            o.textContent = f.title;
            gf.appendChild(o);
          });
        }

        var current = state.quiz
          ? "quiz:" + state.quiz
          : state.form
            ? "form:" + state.form
            : state.poll
              ? "poll:" + state.poll
              : state.show;
        what.value = current;
        if (!what.value) what.value = "join";
      }

      function readChoices() {
        var value = $("what").value;
        state.poll = null;
        state.quiz = null;
        state.form = null;

        if (value.indexOf("poll:") === 0) {
          state.show = "interaction";
          state.poll = parseInt(value.slice(5), 10);
        } else if (value.indexOf("quiz:") === 0) {
          state.show = "interaction";
          state.quiz = parseInt(value.slice(5), 10);
        } else if (value.indexOf("form:") === 0) {
          state.show = "interaction";
          state.form = parseInt(value.slice(5), 10);
        } else {
          state.show = value;
        }

        ["theme", "panel", "radius", "shadow", "layout", "board"].forEach(function (key) { state[key] = $(key).value; });

        var own = $("ownColours").checked;
        state.text = own ? $("text").value : "";
        state.bar = own ? $("bar").value : "";
      }

      function openSetup(atStep2) {
        $("setup").hidden = false;
        $("stage").hidden = true;
        $("step1").hidden = !!atStep2;
        $("step2").hidden = !atStep2;
        $("save").disabled = false;
        $("connect").disabled = false;
        $("url").value = state.link;
        ["theme", "panel", "radius", "shadow", "layout", "board"].forEach(function (key) { $(key).value = state[key]; });

        var own = !!(state.text || state.bar);
        $("ownColours").checked = own;
        $("colours").hidden = !own;
        if (state.text) $("text").value = state.text;
        if (state.bar) $("bar").value = state.bar;
      }

      function goToStep2() {
        var parts = parseLink($("url").value.trim());
        if (!parts) { say(t("That does not look like a Claper slide link.")); return; }

        state.link = parts.base;
        $("connect").disabled = true;
        say(t("Asking Claper…"));

        loadCatalogue(parts)
          .then(function (body) {
            fillChoices(body);
            $("intro").textContent = body.event && body.event.name
              ? "Connected to " + body.event.name + ". Choose what this slide shows."
              : "Choose what this slide shows.";
            openSetup(true);
            say("");
          })
          .catch(function (e) { say(e.message); })
          .then(function () { $("connect").disabled = false; });
      }

      Office.onReady(function () {
        var saved = null;
        try { saved = JSON.parse(Office.context.document.settings.get(KEY) || "null"); } catch (e) {}
        if (saved) state = Object.assign(state, saved);

        // The deck's own link wins over one this block remembered earlier, so a
        // link made again for the presentation reaches blocks that are already
        // sitting on slides instead of leaving them pointing at a dead one.
        readDeckLink().then(function (deckLink) {
          var fromDeck = deckLink && parseLink(deckLink);
          if (fromDeck) state.link = fromDeck.base;

          // The address is only known now, and it is where the words come from.
          return loadLanguage().then(function () { decide(saved); });
        });

        function decide(saved) {
          if (saved && saved.link && state.link) {
            // Configured before: show it, using the deck's current link.
            present();
          } else if (state.link) {
            // The deck knows the link but this block has never been told what to
            // show. Skip the pasting and go straight to the choice.
            reconfigure();
          } else {
            openSetup(false);
          }
        }

        $("change").addEventListener("click", reconfigure);
        $("ownColours").addEventListener("change", function () {
          $("colours").hidden = !$("ownColours").checked;
        });
        $("connect").addEventListener("click", goToStep2);
        $("url").addEventListener("keydown", function (e) { if (e.key === "Enter") goToStep2(); });
        $("useOther").addEventListener("click", function () { openSetup(false); say(""); });

        $("save").addEventListener("click", function () {
          readChoices();
          $("save").disabled = true;

          try {
            Office.context.document.settings.set(KEY, JSON.stringify(state));
            Office.context.document.settings.saveAsync(function (result) {
              if (result.status === Office.AsyncResultStatus.Succeeded) {
                present();
              } else {
                $("save").disabled = false;
                say("PowerPoint could not save this: " + (result.error && result.error.message));
              }
            });
          } catch (e) {
            $("save").disabled = false;
            say("PowerPoint could not save this.");
          }
        });
      });
    </script>
  </body>
</html>
